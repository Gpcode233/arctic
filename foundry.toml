[profile.default]
src = "contracts"
out = "contracts/out"
libs = ["lib"]
test = "contracts/test"
cache_path = "contracts/cache"
evm_version = "cancun"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
no_match_path = "lib/**/test/**"
